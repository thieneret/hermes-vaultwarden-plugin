name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest vaultwarden/tests/ -v --tb=short
        continue-on-error: false

      - name: Lint with ruff
        run: |
          ruff check vaultwarden/ || echo "Ruff found style issues (non-blocking)"
        continue-on-error: true

      - name: Show ruff details (if any issues)
        run: |
          ruff check vaultwarden/ --output-format=github
        continue-on-error: true
