name: vaultwarden
version: 0.6.6
description: >
  Vaultwarden secrets management for Hermes Agent. Provides secure
  access to vault items via placeholder injection, plus SSH key
  storage and ssh-agent integration.
author: thieneret
requires_bins:
  - bw
provides_tools:
  - vaultwarden_status
  - vaultwarden_sync
  - vaultwarden_list
  - vaultwarden_search
  - vaultwarden_get_secret_ref
  - vaultwarden_store
  - vaultwarden_update
  - vaultwarden_delete
  # v0.3.7 (VWP-12): vaultwarden_generate_password removed — generation is
  # integrated into vaultwarden_store / vaultwarden_update via generate=true.
  # v0.2.8: SSH key management
  - vaultwarden_store_ssh
  - vaultwarden_update_ssh
  - vaultwarden_delete_ssh
  - vaultwarden_use_ssh
config:
  enabled:
    type: boolean
    default: false
    description: Enable the Vaultwarden plugin.
  server_url:
    type: string
    description: Vaultwarden server URL (e.g. https://vault.example.com).
  client_id:
    type: string
    description: API-key client id ("user.<uuid>").
  # v0.5.0 (BREAKING): client_secret_env / master_password_env REMOVED.
  # Bootstrap secrets now live in $HERMES_HOME/plugins/vaultwarden/secrets.yaml
  # (chmod 600, enforced by the plugin). Copy secret.yaml.template to
  # secrets.yaml and fill in client_secret / master_password. They never
  # enter the OS environment or Hermes secret_scope.
  appdata_dir_env:
    type: string
    default: VW_APPDATA_DIR
    description: NAME of optional env var overriding the isolated bw appdata dir.
  allow_write:
    type: boolean
    default: false
    description: Allow store/update/delete tools (vault mutations).
  allow_startup_secret_injection:
    type: boolean
    default: false
    description: Register the optional SecretSource adapter (disabled by default).
  # SEC-03 (v0.5.5): fail-closed policy for the local terminal backend.
  allow_insecure_local_backend:
    type: boolean
    default: false
    description: >-
      Explicitly accept the same-user secret-exposure risk of a 'local'
      Hermes terminal backend. With backend 'local' (or unset) the LLM-driven
      terminal runs as the SAME OS user that owns secrets.yaml and can read
      client_secret / master_password via 'cat secrets.yaml', bypassing all
      plugin protections. Default FALSE: the plugin REFUSES to load on a
      local/unset backend (fail-closed, CRITICAL log). Set TRUE only on
      trusted single-user machines (a WARNING is then logged). Recommended
      posture: use the docker / ssh / modal backends for privilege separation.
  # v0.3.7 (VWP-14): allow_direct_secret_retrieval removed entirely.
  # vaultwarden_get_secret_ref always returns only a placeholder.
  auto_sync:
    type: boolean
    default: true
  sync_interval_seconds:
    type: integer
    default: 300
  session_timeout_seconds:
    type: integer
    default: 14400
  placeholder_ttl_seconds:
    type: integer
    default: 300
  max_placeholders:
    type: integer
    default: 50
  bw_cli_path:
    type: string
    default: ""
    required: true
    description: >-
      REQUIRED FULL path (absolute) to the bw binary (e.g. /usr/local/bin/bw).
      A directory path alone is NOT sufficient. VWP-01 (v0.4.7, BREAKING):
      there is NO PATH lookup and NO environment-variable override —
      config.yaml is the single source of truth. The path must be an absolute regular
      file with no symlink anywhere in its chain, executable, not
      group/world-writable, and owned by root or the current user; the
      plugin fails closed (does not load) otherwise.
  # v0.3.8 (VWP-10): retry / backoff for idempotent bw calls. NOTE: the
  # minimum supported bw version is deliberately NOT configurable (VWP-11:
  # fail-closed, no override).
  bw_max_retries:
    type: integer
    default: 3
    description: >-
      Maximum retry attempts for idempotent bw calls on network errors.
      Non-idempotent operations (login/unlock/create attachment/delete)
      are never retried.
  bw_backoff_base:
    type: number
    default: 1.0
    description: >-
      Base delay in seconds for exponential backoff between retries
      (delay = base * 2^attempt + jitter).
  bw_max_delay:
    type: number
    default: 10.0
    description: >-
      Upper cap in seconds for any single retry backoff delay.
  terminal_tool_names:
    type: array
    default: []
    description: >-
      Tool names treated as terminal/exec for placeholder injection.
      Empty list uses built-in defaults (terminal, shell, bash,
      execute_command, run_command, exec, code_execution).
  terminal_command_keys:
    type: array
    default: []
    description: >-
      Argument keys scanned for the command string in terminal tools.
      Empty list uses built-in defaults (command, cmd, input, script, code).
  # VWP-13 (v0.4.3): opt-in metadata masking for list/search responses.
  metadata_masking:
    type: boolean
    default: false
    description: >-
      When true, vaultwarden_list and vaultwarden_search mask 'username'
      and 'uris' with '***'. 'name', 'id', 'type', 'folder_id' are never
      masked (needed for item identification). Default OFF preserves
      search/list usability.
