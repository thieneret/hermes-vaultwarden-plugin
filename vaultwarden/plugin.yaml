# vaultwarden/plugin.yaml — v0.2.3
name: vaultwarden
version: 0.2.4
description: >-
  Vaultwarden secrets management for Hermes Agent via the `bw` CLI.
  Secrets are never exposed to the LLM context: tools return single-use
  placeholders (__VW_SECRET_xxxxxxxxxxxxxx__) which a chain-safe
  `tool_request` middleware resolves into terminal commands just before
  execution, with `post_tool_call` cleanup/redaction afterwards. All
  subprocesses run with an isolated BITWARDENCLI_APPDATA_DIR so the
  plugin's bw state never touches the host user's bw profile.
author: thieneret
requires_bins:
  - bw
config:
  enabled:
    type: boolean
    default: false
    description: Enable the Vaultwarden plugin.
  server_url:
    type: string
    description: Vaultwarden server URL (e.g. https://vault.example.com).
  client_id:
    type: string
    description: API-key client id ("user.<uuid>").
  client_secret_env:
    type: string
    default: VW_CLIENT_SECRET
    description: NAME of the env var holding the client secret (value lives in .env).
  master_password_env:
    type: string
    default: VW_MASTER_PASSWORD
    description: NAME of the env var holding the master password (value lives in .env).
  appdata_dir_env:
    type: string
    default: VW_APPDATA_DIR
    description: NAME of optional env var overriding the isolated bw appdata dir.
  allow_write:
    type: boolean
    default: false
    description: Allow store/update/delete tools (vault mutations).
  allow_startup_secret_injection:
    type: boolean
    default: false
    description: Register the optional SecretSource adapter (disabled by default).
  allow_direct_secret_retrieval:
    type: boolean
    default: false
    description: Allow returning raw secret values from get_secret_ref (NOT recommended).
  auto_sync:
    type: boolean
    default: true
  sync_interval_seconds:
    type: integer
    default: 300
  session_timeout_seconds:
    type: integer
    default: 14400
  placeholder_ttl_seconds:
    type: integer
    default: 300
  max_placeholders:
    type: integer
    default: 50
  bw_cli_path:
    type: string
    default: ""
    description: >-
      Optional FULL path to the bw binary (e.g. /usr/local/bin/bw).
      A directory path alone is NOT sufficient. BW_CLI_PATH env overrides.
  terminal_tool_names:
    type: array
    default: []
    description: >-
      Tool names treated as terminal/exec for placeholder injection.
      Empty list uses built-in defaults (terminal, shell, bash,
      execute_command, run_command, exec, code_execution).
  terminal_command_keys:
    type: array
    default: []
    description: >-
      Argument keys scanned for the command string in terminal tools.
      Empty list uses built-in defaults (command, cmd, input, script, code).
